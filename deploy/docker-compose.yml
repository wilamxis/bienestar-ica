# Servidor propio (VPS): la aplicación + Caddy, que consigue y renueva el certificado HTTPS automáticamente.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - datos:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    depends_on: [app]
volumes:
  datos:
  caddy_datos:
