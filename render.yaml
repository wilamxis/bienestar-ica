# Blueprint de Render, variante GRATUITA para demostración.
# Sin DATABASE_URL el disco gratuito es efímero (los datos se pierden al reiniciar). Con DATABASE_URL (Neon) los datos son permanentes.
# Con DEMO=1 los datos y usuarios de ejemplo se recrean solos en cada arranque.
services:
  - type: web
    name: bienestar-ica
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEMO
        value: "1"
      - key: DATABASE_URL   # pegue la connection string de Neon (datos permanentes)
        sync: false
